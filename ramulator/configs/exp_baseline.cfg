################################################################################
# LPDDR5-PIM Configuration for ComPASS Evaluation
# 4 Channels, 2 Ranks per channel, 16 Banks, LPDDR5-6400 (3200 MHz, BL16)
################################################################################
standard = LPDDR5
channels = 4
ranks = 2
speed = LPDDR5_6400
org = LPDDR5_8Gb_x16

record_cmd_trace = off
print_cmd_trace = off

# CPU / Memory clock frequency ratio
cpu_tick = 1
mem_tick = 1

# Simulation limits for fast and accurate evaluation
early_exit = on
expected_limit_insts = 2000000
warmup_insts = 200000
cache = no
translation = None

# PIM and Scheduling parameters (can be overridden per run)
 pim = false
 scheduling_policy = FR-FCFS
 pim_work = 0
 pim_target_time = 5000000

 blc_lambda = 0.01
